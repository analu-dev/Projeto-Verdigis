<div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if dica %}
        <small>{{ dica }}</small>
    {% endif %}
    {% if field.help_text %}
        <small>{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <div class="alert alert-error">
            {% for erro in field.errors %}{{ erro }}{% endfor %}
        </div>
    {% endif %}
</div>
